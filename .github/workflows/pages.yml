name: Deploy Parla to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate application
        run: |
          node --check hub.js
          node --check sw.js
          node --check shared/core-v2.js
          node --check italiano/foundation-v2.js
          node --check italiano/a1-v2.js
          node --check italiano/course-v2.js
          node --check italiano/sw.js
          node --check deutsch/foundation-v2.js
          node --check deutsch/a1-v2.js
          node --check deutsch/course-v2.js
          node --check deutsch/sw.js
          node scripts/validate-courses.js
          python - <<'PY'
          from pathlib import Path
          import json

          json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          json.loads(Path("italiano/manifest.json").read_text(encoding="utf-8"))
          json.loads(Path("deutsch/manifest.json").read_text(encoding="utf-8"))

          hub_html = Path("index.html").read_text(encoding="utf-8")
          for route in ("./italiano/", "./deutsch/"):
              if route not in hub_html:
                  raise SystemExit(f"Hub: missing route {route}")

          for name, root in {"Italiano": Path("italiano"), "Deutsch": Path("deutsch")}.items():
              required = ["index.html","foundation-v2.js","a1-v2.js","course-v2.js","manifest.json","icon.svg","sw.js"]
              missing = [asset for asset in required if not (root / asset).exists()]
              if missing:
                  raise SystemExit(f"{name}: missing assets {missing}")
              html = (root / "index.html").read_text(encoding="utf-8")
              for asset in ("foundation-v2.js","a1-v2.js","course-v2.js","../shared/core-v2.js","../shared/styles-v2.css"):
                  if asset not in html:
                      raise SystemExit(f"{name}: {asset} not loaded")

          print("Parla Hub + Italian A1 + German A1 checks passed")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
