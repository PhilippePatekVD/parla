name: Deploy Parla to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check sw.js
          node --check shared/core-v2.js
          node --check italiano/foundation-v2.js
          node --check italiano/a1-v2.js
          node --check italiano/course-v2.js
          node --check italiano/sw.js
          node --check deutsch/foundation-v2.js
          node --check deutsch/a1-v2.js
          node --check deutsch/course-v2.js
          node --check deutsch/sw.js
          node --check scripts/validate-courses.js

      - name: Validate curricula
        run: node scripts/validate-courses.js

      - name: Validate static application
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          json.loads(Path("italiano/manifest.json").read_text(encoding="utf-8"))
          json.loads(Path("deutsch/manifest.json").read_text(encoding="utf-8"))

          hub = Path("index.html").read_text(encoding="utf-8")
          for route in ("./italiano/", "./deutsch/"):
              if route not in hub:
                  raise SystemExit(f"Hub missing route {route}")

          for asset in ("shared/core-v2.js", "shared/styles-v2.css"):
              if not Path(asset).exists():
                  raise SystemExit(f"Missing shared asset {asset}")

          required = ["index.html","foundation-v2.js","a1-v2.js","course-v2.js","manifest.json","icon.svg","sw.js"]
          loaded = ["foundation-v2.js","a1-v2.js","course-v2.js","../shared/core-v2.js","../shared/styles-v2.css"]

          for name, root in {"Italiano": Path("italiano"), "Deutsch": Path("deutsch")}.items():
              missing = [asset for asset in required if not (root / asset).exists()]
              if missing:
                  raise SystemExit(f"{name}: missing assets {missing}")
              html = (root / "index.html").read_text(encoding="utf-8")
              if 'id="app"' not in html:
                  raise SystemExit(f"{name}: missing app root")
              for asset in loaded:
                  if asset not in html:
                      raise SystemExit(f"{name}: {asset} not loaded")
              if "a2-v2.js" in html:
                  raise SystemExit(f"{name}: A2 must not be loaded during A1 phase")

          print("Parla Hub + Italiano A1 + Deutsch A1 static checks passed")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
