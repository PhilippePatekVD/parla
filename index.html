<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parla!">
<meta name="description" content="Parla! — coach d'italien interactif et local.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Parla! — Italiano Coach</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#202720;--muted:#727971;--line:#e7e1d7;--green:#176b4f;--green2:#dcece5;--red:#9d3d3d;--red2:#f6e3df;--shadow:0 18px 55px rgba(45,40,32,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}.shell{max-width:960px;margin:auto;padding:18px 16px calc(36px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#176b4f,#2b8465);color:white;display:grid;place-items:center;font-weight:900}.brand b{font-size:20px}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 13px}.nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero{padding:30px;background:radial-gradient(circle at 90% 10%,rgba(23,107,79,.15),transparent 35%),#fff}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--green)}h1,h2,h3,p{margin-top:0}.hero h1{font-size:42px;line-height:1.03;letter-spacing:-.05em;margin:10px 0 12px}.hero p,.muted{color:var(--muted);line-height:1.6}.primary{border:0;background:var(--green);color:#fff;border-radius:14px;padding:13px 17px;font-weight:800}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.stat{padding:19px}.stat strong{font-size:29px;display:block;letter-spacing:-.04em}.stat span{font-size:12px;color:var(--muted)}.section{margin-top:25px}.section h2{font-size:25px;letter-spacing:-.04em;margin-bottom:5px}.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.lesson{padding:20px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:42px 1fr auto;gap:13px;align-items:center}.num{width:42px;height:42px;border-radius:14px;background:#f5f3ee;display:grid;place-items:center;color:var(--green);font-weight:900}.lesson h3{margin:0 0 4px;font-size:17px}.lesson p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}.pill{background:var(--green2);color:var(--green);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}.practice{max-width:700px;margin:auto}.progress{height:8px;border-radius:999px;background:#eee9df;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:var(--green)}.exercise{padding:25px;margin-top:12px}.prompt{font-size:24px;font-weight:800;line-height:1.35;letter-spacing:-.03em;margin:15px 0}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.answer{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);outline:0}.answer:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(23,107,79,.08)}.feedback{margin-top:14px;padding:14px;border-radius:14px;line-height:1.45}.ok{background:var(--green2);color:#174e3c}.bad{background:var(--red2);color:#7d3030}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}.review{max-width:640px;margin:auto;padding:26px}.word{font-size:38px;font-weight:900;letter-spacing:-.04em;margin:14px 0 5px}.translation{font-size:18px;color:var(--muted)}.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:20px}.rates button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 6px}.empty{text-align:center;padding:34px}.install{padding:18px;margin-top:14px}.install ol{color:var(--muted);line-height:1.7;padding-left:22px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
@media(max-width:700px){.top{display:block;position:sticky;top:env(safe-area-inset-top);z-index:5;background:rgba(246,243,236,.94);backdrop-filter:blur(14px);padding:4px 0 10px}.nav{margin-top:11px;display:grid;grid-template-columns:repeat(4,1fr)}.nav button{padding:9px 4px;font-size:11px}.hero{padding:23px}.hero h1{font-size:34px}.stats,.lesson-grid{grid-template-columns:1fr}.lesson{grid-template-columns:42px 1fr auto}.rates{grid-template-columns:repeat(2,1fr)}.primary,.ghost,.choice,.answer{min-height:48px}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
var KEY="parla_v1";
var lessons=[
{id:"l1",title:"Ciao! Le basi",sub:"Saluer et prendre congé.",v:[["ciao","salut / au revoir"],["buongiorno","bonjour"],["grazie","merci"],["arrivederci","au revoir"]],q:[
{t:"mcq",p:"Comment dit-on « bonjour » le matin ?",c:["Buonasera","Buongiorno","Arrivederci"],a:"Buongiorno",e:"Buongiorno s'emploie le matin et en journée."},
{t:"text",p:"Traduisez : « Merci beaucoup »",a:["grazie mille","molte grazie"],m:"Grazie mille.",e:"Grazie mille est la formulation la plus naturelle."},
{t:"text",p:"Écrivez : « Au revoir »",a:["arrivederci"],m:"Arrivederci.",e:"Une formule neutre et polie."}]},
{id:"l2",title:"Mi presento",sub:"Se présenter simplement.",v:[["mi chiamo","je m'appelle"],["piacere","enchanté"],["abito a","j'habite à"],["e tu?","et toi ?"]],q:[
{t:"text",p:"Traduisez : « Je m'appelle Luca »",a:["mi chiamo luca","io mi chiamo luca"],m:"Mi chiamo Luca.",e:"Le pronom io est souvent omis."},
{t:"mcq",p:"« Piacere » signifie :",c:["Pardon","Enchanté","Demain"],a:"Enchanté",e:"Piacere s'utilise lors d'une présentation."},
{t:"text",p:"Écrivez : « J'habite à Lausanne »",a:["abito a lausanne","io abito a lausanne"],m:"Abito a Lausanne.",e:"Avec une ville, on utilise généralement a."}]},
{id:"l3",title:"Al bar",sub:"Commander au café.",v:[["un caffè","un café"],["vorrei","je voudrais"],["per favore","s'il vous plaît"],["quanto costa?","combien ça coûte ?"]],q:[
{t:"text",p:"Commandez poliment un café.",a:["vorrei un caffè","vorrei un caffè per favore","un caffè per favore"],m:"Vorrei un caffè, per favore.",e:"Vorrei est très naturel pour commander."},
{t:"mcq",p:"« Quanto costa? » signifie :",c:["Où est-ce ?","Combien ça coûte ?","À demain ?"],a:"Combien ça coûte ?",e:"Quanto = combien ; costa = coûte."},
{t:"text",p:"Traduisez : « S'il vous plaît »",a:["per favore"],m:"Per favore.",e:"Expression incontournable."}]},
{id:"l4",title:"Orientarsi",sub:"Demander son chemin.",v:[["dov'è?","où est ?"],["a destra","à droite"],["a sinistra","à gauche"],["sempre dritto","tout droit"]],q:[
{t:"text",p:"Demandez : « Où est la gare ? »",a:["dov'è la stazione","dove è la stazione"],m:"Dov'è la stazione?",e:"Dove è se contracte souvent en dov'è."},
{t:"mcq",p:"« A sinistra » signifie :",c:["À droite","À gauche","Tout droit"],a:"À gauche",e:"Sinistra = gauche."},
{t:"text",p:"Traduisez : « Tout droit »",a:["sempre dritto","dritto"],m:"Sempre dritto.",e:"Très courant pour indiquer un itinéraire."}]},
{id:"l5",title:"Al ristorante",sub:"Commander et demander l'addition.",v:[["il conto","l'addition"],["senza","sans"],["con","avec"],["prendo","je prends"]],q:[
{t:"text",p:"Demandez l'addition poliment.",a:["il conto per favore","potrei avere il conto","potrei avere il conto per favore"],m:"Il conto, per favore.",e:"Simple et parfaitement naturel."},
{t:"mcq",p:"« Senza » signifie :",c:["Avec","Sans","Encore"],a:"Sans",e:"Senza = sans."},
{t:"text",p:"Traduisez : « Je prends les pâtes »",a:["prendo la pasta"],m:"Prendo la pasta.",e:"Prendo est très courant pour choisir un plat."}]},
{id:"l6",title:"Piccola conversazione",sub:"Tenir un mini-échange.",v:[["come va?","comment ça va ?"],["molto bene","très bien"],["oggi","aujourd'hui"],["domani","demain"]],q:[
{t:"text",p:"Répondez à « Come va? » par « Très bien, merci ».",a:["molto bene grazie","benissimo grazie"],m:"Molto bene, grazie.",e:"Une réponse simple et naturelle."},
{t:"mcq",p:"« Oggi » signifie :",c:["Hier","Aujourd'hui","Demain"],a:"Aujourd'hui",e:"Oggi = aujourd'hui."},
{t:"text",p:"Traduisez : « À demain ! »",a:["a domani"],m:"A domani!",e:"Expression très courante."}]}
];
function fresh(){return{done:{},xp:0,streak:1,last:null,reviews:{},view:"home"}}
var s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){s=fresh()}
var app=document.getElementById("app"),session=null,queue=[],ri=0,reveal=false;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function norm(x){return String(x||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?;:]/g,"").replace(/\s+/g," ")}
function day(){return new Date().toISOString().slice(0,10)}
function study(){var d=day();if(s.last===d)return;if(s.last){var n=Math.round((new Date(d)-new Date(s.last))/86400000);s.streak=n===1?s.streak+1:1}else s.streak=1;s.last=d;save()}
function due(){var n=Date.now();return Object.keys(s.reviews).filter(function(k){return s.reviews[k].due<=n})}
function progress(){return Math.round(Object.keys(s.done).length/lessons.length*100)}
function speak(t){if(!("speechSynthesis" in window))return;var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function top(active){return '<div class="top"><div class="brand"><div class="logo">P!</div><div><b>Parla!</b><small>Italiano Coach</small></div></div><div class="nav"><button data-v="home" class="'+(active==="home"?"on":"")+'">Accueil</button><button data-v="lessons" class="'+(active==="lessons"?"on":"")+'">Leçons</button><button data-v="review" class="'+(active==="review"?"on":"")+'">Révisions'+(due().length?" "+due().length:"")+'</button><button data-v="install">iPhone</button></div></div>'}
function bindNav(){document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){render(b.getAttribute("data-v"))}})}
function lessonCard(l,i){return '<button class="lesson" data-l="'+l.id+'"><div class="num">'+String(i+1).padStart(2,"0")+'</div><div><h3>'+l.title+'</h3><p>'+l.sub+'</p></div><span class="pill">'+(s.done[l.id]?"Terminé":"A1")+'</span></button>'}
function render(v){s.view=v;save();if(v==="home")home();else if(v==="lessons")list();else if(v==="review")reviews(true);else if(v==="install")install();bindNav()}
function home(){var next=lessons.find(function(l){return !s.done[l.id]})||lessons[0];app.innerHTML='<main class="shell">'+top("home")+'<section class="card hero"><div class="eyebrow">Votre italien, un peu chaque jour</div><h1>Construisez de vrais réflexes en italien.</h1><p>Micro-leçons utiles, réponses écrites, prononciation italienne et révisions espacées. Aucune API et aucune donnée envoyée à un serveur.</p><div class="actions"><button class="primary" id="go">Continuer · '+next.title+'</button><button class="ghost" data-v="review">Réviser '+due().length+' carte(s)</button></div></section><section class="stats"><div class="card stat"><strong>'+s.xp+'</strong><span>XP</span></div><div class="card stat"><strong>'+Object.keys(s.done).length+'/'+lessons.length+'</strong><span>Leçons terminées</span></div><div class="card stat"><strong>'+s.streak+'</strong><span>Jour(s) de série</span></div></section><section class="section"><h2>Prochaine étape</h2><p class="muted">Parcours A1 · '+progress()+' % terminé</p>'+lessonCard(next,lessons.indexOf(next))+'</section><div class="footer">100 % local · 0 API · PWA iPhone</div></main>';document.getElementById("go").onclick=function(){start(next.id)};document.querySelector("[data-l]").onclick=function(){start(next.id)}}
function list(){app.innerHTML='<main class="shell">'+top("lessons")+'<section class="section"><h2>Parcours A1</h2><p class="muted">Six premières situations pour commencer à parler utile.</p><div class="lesson-grid">'+lessons.map(lessonCard).join("")+'</div></section></main>';document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){start(b.getAttribute("data-l"))}})}
function start(id){session={l:lessons.find(function(x){return x.id===id}),i:0,score:0,answered:false};exercise()}
function exercise(){var l=session.l;if(session.i>=l.q.length){finish();return}var q=l.q[session.i],input=q.t==="mcq"?'<div class="choices">'+q.c.map(function(c){return '<button class="choice" data-c="'+c.replace(/"/g,"&quot;")+'">'+c+'</button>'}).join("")+'</div>':'<input id="ans" class="answer" autocomplete="off" placeholder="Écrivez votre réponse en italien…">';app.innerHTML='<main class="shell practice">'+top("")+'<section class="card hero"><div class="eyebrow">A1 · '+l.title+'</div><h2>'+l.sub+'</h2><div class="progress"><span style="width:'+Math.round(session.i/l.q.length*100)+'%"></span></div></section><section class="card exercise"><div class="row"><span class="muted">Exercice '+(session.i+1)+' / '+l.q.length+'</span><button class="ghost" id="audio">🔊 Écouter</button></div><div class="prompt">'+q.p+'</div>'+input+'<div id="fb"></div><div class="row"><button class="ghost" data-v="lessons">Quitter</button>'+(q.t==="mcq"?"":'<button class="primary" id="check">Valider</button>')+'</div></section></main>';bindNav();document.getElementById("audio").onclick=function(){speak(q.m||q.a)};if(q.t==="mcq")document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){check(b.getAttribute("data-c"))}});else{document.getElementById("check").onclick=function(){check(document.getElementById("ans").value)};document.getElementById("ans").onkeydown=function(e){if(e.key==="Enter")check(e.target.value)};document.getElementById("ans").focus()}}
function check(v){if(session.answered)return;session.answered=true;var q=session.l.q[session.i],ok=q.t==="mcq"?norm(v)===norm(q.a):q.a.some(function(a){return norm(a)===norm(v)});if(ok){session.score++;s.xp+=10}else s.xp+=2;study();save();document.getElementById("fb").innerHTML='<div class="feedback '+(ok?"ok":"bad")+'"><b>'+(ok?"✓ Correct":"À revoir")+'</b><br>'+(ok?"":'Réponse conseillée : <b>'+q.m+'</b><br>')+q.e+'</div>';var n=document.createElement("button");n.className="primary";n.textContent=session.i===session.l.q.length-1?"Terminer":"Continuer";n.onclick=function(){session.i++;session.answered=false;exercise()};document.querySelector(".exercise .row:last-child").appendChild(n)}
function finish(){var l=session.l;s.done[l.id]={date:day(),score:session.score};l.v.forEach(function(v){var id=l.id+":"+v[0];if(!s.reviews[id])s.reviews[id]={it:v[0],fr:v[1],level:0,due:Date.now()}});s.xp+=25;study();save();app.innerHTML='<main class="shell practice">'+top("")+'<section class="card hero" style="text-align:center"><div class="eyebrow">Leçon terminée</div><h1>'+Math.round(session.score/l.q.length*100)+' %</h1><p>'+l.v.length+' mots ont été ajoutés à vos révisions espacées.</p><div class="actions" style="justify-content:center"><button class="primary" data-v="review">Commencer les révisions</button><button class="ghost" data-v="lessons">Autres leçons</button></div></section></main>';bindNav()}
function reviews(reset){if(reset){queue=due();ri=0;reveal=false}app.innerHTML='<main class="shell">'+top("review")+'<div id="rev"></div></main>';bindNav();reviewCard()}
function reviewCard(){var box=document.getElementById("rev");if(!queue.length||ri>=queue.length){box.innerHTML='<section class="card empty"><h2>✓ Révisions à jour</h2><p class="muted">Les prochaines cartes apparaîtront quand elles seront dues.</p><button class="ghost" data-v="home">Retour à l’accueil</button></section>';bindNav();return}var id=queue[ri],c=s.reviews[id];box.innerHTML='<section class="card review"><div class="row"><span class="muted">Carte '+(ri+1)+' / '+queue.length+'</span><button class="ghost" id="sp">🔊</button></div><div class="eyebrow">Traduisez mentalement</div><div class="word">'+c.it+'</div>'+(reveal?'<div class="translation">'+c.fr+'</div><div class="rates"><button data-r="0">Encore</button><button data-r="1">Difficile</button><button data-r="2">Bien</button><button data-r="3">Facile</button></div>':'<button class="primary" id="show">Afficher la réponse</button>')+'</section>';document.getElementById("sp").onclick=function(){speak(c.it)};if(!reveal)document.getElementById("show").onclick=function(){reveal=true;reviewCard()};else document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){rate(id,Number(b.getAttribute("data-r")));ri++;reveal=false;reviewCard()}})}
function rate(id,r){var c=s.reviews[id],ints=[0,1,3,7,14,30];if(r===0)c.level=0;else c.level=Math.min(ints.length-1,c.level+(r===3?2:1));c.due=Date.now()+(r===0?10/1440:ints[c.level])*86400000;s.xp+=r===0?1:3;study();save()}
function install(){app.innerHTML='<main class="shell">'+top("install")+'<section class="card hero"><div class="eyebrow">Installation iPhone</div><h1>Parla! comme une vraie app.</h1><p>Une fois le site publié en HTTPS via GitHub Pages :</p><ol><li>Ouvrez Parla! dans Safari.</li><li>Touchez <b>Partager</b>.</li><li>Choisissez <b>Sur l’écran d’accueil</b>.</li><li>Touchez <b>Ajouter</b>.</li></ol><p class="muted">La progression reste enregistrée localement sur cet iPhone.</p></section></main>'}
render(s.view||"home");
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script></body></html>
