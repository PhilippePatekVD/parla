<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Parla — choisissez une langue.">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Parla</title>
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
main{width:min(1040px,calc(100% - 32px));min-height:100vh;margin:0 auto;display:flex;flex-direction:column}
header{height:82px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:-.03em}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#1d1d1f;color:#fff;font-size:17px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 0 72px}h1{margin:0 0 34px;text-align:center;font-size:clamp(38px,6vw,62px);line-height:1;letter-spacing:-.055em}.selector{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lang{min-height:290px;border-radius:32px;background:#fff;color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;box-shadow:0 3px 14px rgba(0,0,0,.055);transition:transform .18s ease,box-shadow .18s ease}.lang:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.09)}
.flag{width:138px;height:138px;border-radius:34px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.08)}
.flag.it{background:linear-gradient(90deg,#159447 0 33.333%,#fff 33.333% 66.666%,#d9363e 66.666%)}
.flag.de{background:linear-gradient(#111 0 33.333%,#d71920 33.333% 66.666%,#f6c343 66.666%)}
.flag.en{background:linear-gradient(32deg,transparent 43%,#fff 43% 57%,transparent 57%),linear-gradient(-32deg,transparent 43%,#fff 43% 57%,transparent 57%),linear-gradient(90deg,transparent 40%,#fff 40% 60%,transparent 60%),linear-gradient(transparent 40%,#fff 40% 60%,transparent 60%),linear-gradient(90deg,transparent 46%,#c8102e 46% 54%,transparent 54%),linear-gradient(transparent 46%,#c8102e 46% 54%,transparent 54%),#012169}
.flag.es{background:linear-gradient(#aa151b 0 25%,#f1bf00 25% 75%,#aa151b 75%)}
.lang strong{font-size:29px;letter-spacing:-.045em}.lang span{margin-top:-13px;color:var(--muted);font-size:11px}
@media(max-width:680px){main{width:min(100% - 24px,520px)}header{height:70px}.hero{justify-content:flex-start;padding:42px 0 44px}h1{font-size:42px;margin-bottom:26px}.selector{grid-template-columns:1fr;gap:14px}.lang{min-height:238px;border-radius:28px;gap:18px}.flag{width:112px;height:112px;border-radius:28px}.lang strong{font-size:27px}}
</style>
</head>
<body>
<main>
  <header><div class="brand"><div class="mark">P</div><div>Parla</div></div></header>
  <section class="hero">
    <h1>Choisis une langue</h1>
    <div class="selector">
      <a class="lang" href="./italiano/" aria-label="Ouvrir le cours d’italien"><div class="flag it" aria-hidden="true"></div><strong>Italien</strong><span>Parla! Italiano Coach</span></a>
      <a class="lang" href="./deutsch/" aria-label="Ouvrir le cours d’allemand"><div class="flag de" aria-hidden="true"></div><strong>Allemand</strong><span>Sprich! Deutsch Coach</span></a>
      <a class="lang" href="./english/" aria-label="Ouvrir le cours d’anglais"><div class="flag en" aria-hidden="true"></div><strong>Anglais</strong><span>Speak! English Coach</span></a>
      <a class="lang" href="./espanol/" aria-label="Ouvrir le cours d’espagnol"><div class="flag es" aria-hidden="true"></div><strong>Espagnol</strong><span>¡Habla! Español Coach</span></a>
    </div>
  </section>
</main>
</body>
</html>
