<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Parla!">
<meta name="description" content="Parla! — coach d'italien interactif et local.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Parla! — Italiano Coach</title>
<style>
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --surface-2:#fbfbfd;
  --ink:#1d1d1f;
  --muted:#6e6e73;
  --muted-2:#86868b;
  --line:rgba(0,0,0,.08);
  --blue:#0071e3;
  --blue-hover:#0077ed;
  --blue-soft:#eaf4ff;
  --green:#248a3d;
  --green-soft:#edf8ef;
  --red:#d70015;
  --red-soft:#fff0f1;
  --shadow-sm:0 2px 8px rgba(0,0,0,.05);
  --shadow:0 14px 40px rgba(0,0,0,.07);
  --radius-xl:30px;
  --radius-lg:22px;
  --radius-md:16px;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid rgba(0,113,227,.28);outline-offset:2px}
.shell{max-width:1060px;margin:0 auto;padding:0 22px calc(54px + env(safe-area-inset-bottom))}
.top{
  position:sticky;top:env(safe-area-inset-top);z-index:20;
  min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:28px;
  margin:0 -22px 30px;padding:0 22px;
  background:rgba(250,250,252,.78);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06)
}
.brand{display:flex;align-items:center;gap:10px;min-width:max-content}
.logo{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(145deg,#151516,#333336);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:750;letter-spacing:-.04em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 2px 8px rgba(0,0,0,.12)
}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted-2);font-size:10px;line-height:1.1;margin-top:1px}
.nav{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.nav button{
  border:0;background:transparent;color:#3a3a3c;border-radius:999px;
  padding:8px 11px;font-size:12px;font-weight:450;white-space:nowrap;
  transition:background .18s ease,color .18s ease,transform .18s ease
}
.nav button:hover{background:rgba(0,0,0,.045)}
.nav button:active{transform:scale(.97)}
.nav button.on{background:#1d1d1f;color:#fff}
.card{
  background:var(--surface);border:0;border-radius:var(--radius-xl);
  box-shadow:var(--shadow-sm);
}
.hero{
  position:relative;overflow:hidden;text-align:center;
  padding:72px 64px 66px;
  background:
    radial-gradient(circle at 18% 8%,rgba(0,113,227,.10),transparent 30%),
    radial-gradient(circle at 84% 14%,rgba(175,82,222,.08),transparent 27%),
    linear-gradient(180deg,#fff 0%,#fbfbfd 100%);
  animation:rise .45s ease both
}
.hero:after{
  content:"";position:absolute;inset:auto 12% -80px 12%;height:145px;border-radius:50%;
  background:linear-gradient(90deg,rgba(36,138,61,.10),rgba(255,255,255,0),rgba(215,0,21,.09));
  filter:blur(35px);pointer-events:none
}
.eyebrow{
  position:relative;z-index:1;
  margin-bottom:12px;color:var(--blue);font-size:12px;line-height:1.2;
  font-weight:650;letter-spacing:.01em;text-transform:none
}
h1,h2,h3,p{margin-top:0}
.hero h1{
  position:relative;z-index:1;
  max-width:780px;margin:0 auto 18px;
  font-size:clamp(44px,6.2vw,72px);line-height:.98;letter-spacing:-.055em;font-weight:720
}
.hero h2{
  position:relative;z-index:1;
  max-width:720px;margin:4px auto 8px;font-size:clamp(31px,4vw,48px);line-height:1.05;
  letter-spacing:-.045em;font-weight:700
}
.hero p,.muted{
  color:var(--muted);line-height:1.5
}
.hero p{
  position:relative;z-index:1;
  max-width:650px;margin:0 auto;font-size:18px;letter-spacing:-.01em
}
.actions{
  position:relative;z-index:1;
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px
}
.primary,.ghost{
  min-height:44px;border-radius:999px;padding:11px 18px;font-weight:550;letter-spacing:-.01em;
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease
}
.primary{border:0;background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(0,113,227,.18)}
.primary:hover{background:var(--blue-hover);box-shadow:0 5px 14px rgba(0,113,227,.22)}
.primary:active,.ghost:active{transform:scale(.975)}
.ghost{border:0;background:#e8e8ed;color:var(--ink)}
.ghost:hover{background:#dedee3}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px
}
.stat{
  min-height:146px;padding:26px 28px;display:flex;flex-direction:column;justify-content:flex-end;
  background:var(--surface);animation:rise .5s ease both
}
.stat strong{
  display:block;font-size:42px;line-height:1;font-weight:700;letter-spacing:-.045em
}
.stat span{margin-top:8px;color:var(--muted);font-size:13px}
.section{margin-top:48px}
.section h2{
  margin:0 0 4px;font-size:32px;line-height:1.08;letter-spacing:-.04em;font-weight:700
}
.section>.muted{margin-bottom:18px;font-size:15px}
.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lesson{
  min-height:132px;padding:24px 24px;text-align:left;border:0;background:#fff;border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);display:grid;grid-template-columns:50px 1fr auto;gap:16px;align-items:center;
  transition:transform .22s ease,box-shadow .22s ease,background .22s ease
}
.lesson:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.lesson:active{transform:scale(.99)}
.num{
  width:50px;height:50px;border-radius:15px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--blue);font-weight:650;font-size:14px
}
.lesson h3{margin:0 0 5px;font-size:19px;letter-spacing:-.025em;font-weight:650}
.lesson p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.pill{
  background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:7px 10px;
  font-size:11px;font-weight:600
}
.practice{max-width:760px}
.practice .top{margin-left:-22px;margin-right:-22px}
.progress{height:6px;border-radius:999px;background:#e8e8ed;overflow:hidden;margin-top:22px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#0071e3,#4fa7ff);border-radius:inherit;transition:width .25s ease}
.exercise{
  padding:34px 36px;margin-top:14px;border-radius:var(--radius-xl);
  animation:rise .38s ease both
}
.prompt{
  margin:22px 0 24px;font-size:29px;font-weight:650;line-height:1.22;letter-spacing:-.035em
}
.choices{display:grid;gap:10px}
.choice{
  min-height:54px;border:1px solid rgba(0,0,0,.08);background:#fff;border-radius:15px;
  padding:15px 17px;text-align:left;color:var(--ink);font-weight:500;
  transition:border .16s ease,background .16s ease,transform .16s ease
}
.choice:hover{border-color:rgba(0,113,227,.32);background:#f9fcff}
.choice:active{transform:scale(.99)}
.answer{
  width:100%;min-height:54px;padding:15px 17px;border-radius:15px;border:1px solid rgba(0,0,0,.11);
  background:#fff;outline:0;color:var(--ink);font-size:16px
}
.answer::placeholder,.searchbox::placeholder{color:#98989d}
.answer:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.10)}
.feedback{margin-top:16px;padding:16px 18px;border-radius:16px;line-height:1.45;font-size:14px}
.ok{background:var(--green-soft);color:#1f6a31}
.bad{background:var(--red-soft);color:#a20010}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.review{max-width:650px;margin:0 auto;padding:38px;text-align:center;animation:rise .38s ease both}
.word{font-size:48px;font-weight:700;line-height:1.05;letter-spacing:-.045em;margin:18px 0 8px}
.translation{color:var(--muted);font-size:20px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:24px}
.rates button{
  border:0;background:#f2f2f7;color:var(--ink);border-radius:13px;padding:13px 8px;
  transition:background .16s ease,transform .16s ease
}
.rates button:hover{background:#e8e8ed}
.rates button:active{transform:scale(.97)}
.empty{text-align:center;padding:50px 28px}
.install{padding:18px;margin-top:14px}
.install ol{max-width:480px;margin:24px auto 0;color:var(--muted);line-height:1.8;text-align:left}
.footer{text-align:center;color:var(--muted-2);font-size:11px;margin-top:36px}
.vocab-wrap{max-width:980px}
.vocab-head{
  padding:42px 38px 34px;background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);
  animation:rise .38s ease both
}
.vocab-head h2{margin:4px 0 6px!important;font-size:40px;letter-spacing:-.045em;line-height:1.05}
.vocab-head>.muted{font-size:16px;margin-bottom:0}
.vocab-tabs{
  display:inline-flex;max-width:100%;gap:3px;padding:4px;margin-top:24px;overflow-x:auto;
  background:#f2f2f7;border-radius:999px;scrollbar-width:none
}
.vocab-tabs::-webkit-scrollbar{display:none}
.vocab-tabs button{
  border:0;background:transparent;color:#3a3a3c;border-radius:999px;padding:9px 14px;
  font-weight:520;white-space:nowrap;transition:background .16s ease,color .16s ease
}
.vocab-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.10)}
.searchbox{
  width:100%;margin-top:22px;border:0;background:#f2f2f7;border-radius:14px;
  padding:14px 16px 14px 18px;outline:0;color:var(--ink);font-size:15px
}
.searchbox:focus{box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.vocab-count{font-size:12px;color:var(--muted-2);margin:9px 2px 0}
.vocab-group{margin-top:34px}
.vocab-group h3{font-size:24px;letter-spacing:-.035em;margin:0 0 12px;font-weight:650}
.vocab-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vocab-item{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  min-height:76px;padding:16px 17px;border:0;background:#fff;border-radius:17px;box-shadow:var(--shadow-sm);
  transition:transform .18s ease,box-shadow .18s ease
}
.vocab-item:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.06)}
.vocab-it{font-weight:630;font-size:16px;letter-spacing:-.018em}
.vocab-fr{color:var(--muted);font-size:13px;margin-top:4px}
.vocab-note{color:var(--muted-2);font-size:11px;margin-top:4px;font-style:normal}
.speak-mini{
  border:0;background:#f2f2f7;color:var(--blue);border-radius:50%;width:40px;height:40px;
  display:grid;place-items:center;transition:background .16s ease,transform .16s ease
}
.speak-mini:hover{background:#e7f2ff}.speak-mini:active{transform:scale(.94)}
.no-results{padding:42px;text-align:center;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:780px){
  .shell{padding-left:16px;padding-right:16px}
  .top{
    margin-left:-16px;margin-right:-16px;margin-bottom:22px;padding:0 16px;gap:16px;min-height:54px
  }
  .brand small{display:none}
  .nav{overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{font-size:11px;padding:8px 10px}
  .hero{padding:54px 24px 50px}
  .hero h1{font-size:clamp(40px,11.5vw,58px)}
  .hero h2{font-size:36px}
  .hero p{font-size:16px}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{min-height:112px;padding:18px 14px}
  .stat strong{font-size:31px}
  .stat span{font-size:10px}
  .section{margin-top:38px}
  .section h2{font-size:28px}
  .lesson-grid,.vocab-list{grid-template-columns:1fr}
  .lesson{min-height:112px;padding:19px;grid-template-columns:45px 1fr auto}
  .num{width:45px;height:45px;border-radius:14px}
  .practice .top{margin-left:-16px;margin-right:-16px}
  .exercise{padding:27px 22px}
  .prompt{font-size:25px}
  .review{padding:32px 22px}
  .rates{grid-template-columns:repeat(2,1fr)}
  .vocab-head{padding:30px 22px 25px}
  .vocab-head h2{font-size:34px}
  .vocab-tabs{width:100%}
  .vocab-tabs button{flex:1}
  .vocab-group{margin-top:28px}
  .vocab-group h3{font-size:21px}
  .primary,.ghost,.choice,.answer{min-height:48px}
}
@media(max-width:470px){
  .top{display:block;padding-top:8px;padding-bottom:8px}
  .brand{height:34px}
  .nav{margin-top:6px;margin-left:-6px}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .stat{min-height:100px;padding:15px 12px}
  .stat strong{font-size:28px}
  .lesson{grid-template-columns:42px 1fr}
  .lesson .pill{grid-column:2;justify-self:start;margin-top:-5px}
  .vocab-tabs button{font-size:11px;padding:9px 10px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation:none!important;transition:none!important}
}
</style>
</head>

function fresh(){return{done:{},xp:0,streak:1,last:null,reviews:{},view:"home"}}
var s;try{s=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){s=fresh()}
var app=document.getElementById("app"),session=null,queue=[],ri=0,reveal=false;
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function norm(x){return String(x||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?;:]/g,"").replace(/\s+/g," ")}
function day(){return new Date().toISOString().slice(0,10)}
function study(){var d=day();if(s.last===d)return;if(s.last){var n=Math.round((new Date(d)-new Date(s.last))/86400000);s.streak=n===1?s.streak+1:1}else s.streak=1;s.last=d;save()}
function due(){var n=Date.now();return Object.keys(s.reviews).filter(function(k){return s.reviews[k].due<=n})}
function progress(){return Math.round(Object.keys(s.done).length/lessons.length*100)}
function speak(t){if(!("speechSynthesis" in window))return;var u=new SpeechSynthesisUtterance(t);u.lang="it-IT";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function top(active){return '<div class="top"><div class="brand"><div class="logo">P</div><div><b>Parla!</b><small>Italiano Coach</small></div></div><div class="nav"><button data-v="home" class="'+(active==="home"?"on":"")+'">Accueil</button><button data-v="lessons" class="'+(active==="lessons"?"on":"")+'">Leçons</button><button data-v="vocab" class="'+(active==="vocab"?"on":"")+'">Vocabulaire</button><button data-v="review" class="'+(active==="review"?"on":"")+'">Révisions'+(due().length?" "+due().length:"")+'</button><button data-v="install">iPhone</button></div></div>'}
function bindNav(){document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){render(b.getAttribute("data-v"))}})}
function lessonCard(l,i){return '<button class="lesson" data-l="'+l.id+'"><div class="num">'+String(i+1).padStart(2,"0")+'</div><div><h3>'+l.title+'</h3><p>'+l.sub+'</p></div><span class="pill">'+(s.done[l.id]?"Terminé":"A1")+'</span></button>'}
function render(v){s.view=v;save();if(v==="home")home();else if(v==="lessons")list();else if(v==="vocab")vocab("courant");else if(v==="review")reviews(true);else if(v==="install")install();bindNav()}
function home(){var next=lessons.find(function(l){return !s.done[l.id]})||lessons[0];app.innerHTML='<main class="shell">'+top("home")+'<section class="card hero"><div class="eyebrow">Impara. Ripeti. Parla.</div><h1>L’italien, simplement.</h1><p>Un apprentissage clair, progressif et élégant : leçons courtes, vocabulaire essentiel, prononciation et révisions intelligentes.</p><div class="actions"><button class="primary" id="go">Continuer · '+next.title+'</button><button class="ghost" data-v="review">Réviser '+due().length+' carte(s)</button></div></section><section class="stats"><div class="card stat"><strong>'+s.xp+'</strong><span>XP</span></div><div class="card stat"><strong>'+Object.keys(s.done).length+'/'+lessons.length+'</strong><span>Leçons terminées</span></div><div class="card stat"><strong>'+s.streak+'</strong><span>Jour(s) de série</span></div></section><section class="section"><h2>Prochaine étape</h2><p class="muted">Parcours A1 · '+progress()+' % terminé</p>'+lessonCard(next,lessons.indexOf(next))+'</section><div class="footer">100 % local · 0 API · PWA iPhone</div></main>';document.getElementById("go").onclick=function(){start(next.id)};document.querySelector("[data-l]").onclick=function(){start(next.id)}}
function list(){app.innerHTML='<main class="shell">'+top("lessons")+'<section class="section"><h2>Parcours A1</h2><p class="muted">Six premières situations pour commencer à parler utile.</p><div class="lesson-grid">'+lessons.map(lessonCard).join("")+'</div></section></main>';document.querySelectorAll("[data-l]").forEach(function(b){b.onclick=function(){start(b.getAttribute("data-l"))}})}
function start(id){session={l:lessons.find(function(x){return x.id===id}),i:0,score:0,answered:false};exercise()}
function exercise(){var l=session.l;if(session.i>=l.q.length){finish();return}var q=l.q[session.i],input=q.t==="mcq"?'<div class="choices">'+q.c.map(function(c){return '<button class="choice" data-c="'+c.replace(/"/g,"&quot;")+'">'+c+'</button>'}).join("")+'</div>':'<input id="ans" class="answer" autocomplete="off" placeholder="Écrivez votre réponse en italien…">';app.innerHTML='<main class="shell practice">'+top("")+'<section class="card hero"><div class="eyebrow">A1 · '+l.title+'</div><h2>'+l.sub+'</h2><div class="progress"><span style="width:'+Math.round(session.i/l.q.length*100)+'%"></span></div></section><section class="card exercise"><div class="row"><span class="muted">Exercice '+(session.i+1)+' / '+l.q.length+'</span><button class="ghost" id="audio">🔊 Écouter</button></div><div class="prompt">'+q.p+'</div>'+input+'<div id="fb"></div><div class="row"><button class="ghost" data-v="lessons">Quitter</button>'+(q.t==="mcq"?"":'<button class="primary" id="check">Valider</button>')+'</div></section></main>';bindNav();document.getElementById("audio").onclick=function(){speak(q.m||q.a)};if(q.t==="mcq")document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){check(b.getAttribute("data-c"))}});else{document.getElementById("check").onclick=function(){check(document.getElementById("ans").value)};document.getElementById("ans").onkeydown=function(e){if(e.key==="Enter")check(e.target.value)};document.getElementById("ans").focus()}}
function check(v){if(session.answered)return;session.answered=true;var q=session.l.q[session.i],ok=q.t==="mcq"?norm(v)===norm(q.a):q.a.some(function(a){return norm(a)===norm(v)});if(ok){session.score++;s.xp+=10}else s.xp+=2;study();save();document.getElementById("fb").innerHTML='<div class="feedback '+(ok?"ok":"bad")+'"><b>'+(ok?"✓ Correct":"À revoir")+'</b><br>'+(ok?"":'Réponse conseillée : <b>'+q.m+'</b><br>')+q.e+'</div>';var n=document.createElement("button");n.className="primary";n.textContent=session.i===session.l.q.length-1?"Terminer":"Continuer";n.onclick=function(){session.i++;session.answered=false;exercise()};document.querySelector(".exercise .row:last-child").appendChild(n)}
function finish(){var l=session.l;s.done[l.id]={date:day(),score:session.score};l.v.forEach(function(v){var id=l.id+":"+v[0];if(!s.reviews[id])s.reviews[id]={it:v[0],fr:v[1],level:0,due:Date.now()}});s.xp+=25;study();save();app.innerHTML='<main class="shell practice">'+top("")+'<section class="card hero" style="text-align:center"><div class="eyebrow">Leçon terminée</div><h1>'+Math.round(session.score/l.q.length*100)+' %</h1><p>'+l.v.length+' mots ont été ajoutés à vos révisions espacées.</p><div class="actions" style="justify-content:center"><button class="primary" data-v="review">Commencer les révisions</button><button class="ghost" data-v="lessons">Autres leçons</button></div></section></main>';bindNav()}
function reviews(reset){if(reset){queue=due();ri=0;reveal=false}app.innerHTML='<main class="shell">'+top("review")+'<div id="rev"></div></main>';bindNav();reviewCard()}
function reviewCard(){var box=document.getElementById("rev");if(!queue.length||ri>=queue.length){box.innerHTML='<section class="card empty"><h2>✓ Révisions à jour</h2><p class="muted">Les prochaines cartes apparaîtront quand elles seront dues.</p><button class="ghost" data-v="home">Retour à l’accueil</button></section>';bindNav();return}var id=queue[ri],c=s.reviews[id];box.innerHTML='<section class="card review"><div class="row"><span class="muted">Carte '+(ri+1)+' / '+queue.length+'</span><button class="ghost" id="sp">🔊</button></div><div class="eyebrow">Traduisez mentalement</div><div class="word">'+c.it+'</div>'+(reveal?'<div class="translation">'+c.fr+'</div><div class="rates"><button data-r="0">Encore</button><button data-r="1">Difficile</button><button data-r="2">Bien</button><button data-r="3">Facile</button></div>':'<button class="primary" id="show">Afficher la réponse</button>')+'</section>';document.getElementById("sp").onclick=function(){speak(c.it)};if(!reveal)document.getElementById("show").onclick=function(){reveal=true;reviewCard()};else document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){rate(id,Number(b.getAttribute("data-r")));ri++;reveal=false;reviewCard()}})}
function rate(id,r){var c=s.reviews[id],ints=[0,1,3,7,14,30];if(r===0)c.level=0;else c.level=Math.min(ints.length-1,c.level+(r===3?2:1));c.due=Date.now()+(r===0?10/1440:ints[c.level])*86400000;s.xp+=r===0?1:3;study();save()}

function vocab(tab){
  tab=tab||"courant";
  var names={courant:"Vocabulaire courant",verbi:"Verbes essentiels",espressioni:"Expressions conversationnelles"};
  var counts={courant:"Vocabulaire indispensable du quotidien",verbi:"Les verbes à connaître en priorité",espressioni:"Formules prêtes à employer dans une vraie conversation"};
  app.innerHTML='<main class="shell vocab-wrap">'+top("vocab")+
  '<section class="card vocab-head"><div class="eyebrow">Réviser à la volée</div><h2 style="margin:8px 0 4px">'+names[tab]+'</h2><p class="muted">'+counts[tab]+'</p>'+
  '<div class="vocab-tabs"><button data-tab="courant" class="'+(tab==="courant"?"on":"")+'">Vocabulaire courant</button><button data-tab="verbi" class="'+(tab==="verbi"?"on":"")+'">Verbes</button><button data-tab="espressioni" class="'+(tab==="espressioni"?"on":"")+'">Expressions</button></div>'+
  '<input id="vocabSearch" class="searchbox" type="search" placeholder="Rechercher en italien ou en français…">'+
  '<div class="vocab-count" id="vocabCount"></div></section><div id="vocabResults"></div><div class="footer">Touchez 🔊 pour entendre la prononciation italienne.</div></main>';
  bindNav();
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){vocab(b.getAttribute("data-tab"))}});
  var search=document.getElementById("vocabSearch");
  function draw(){
    var q=norm(search.value),groups=vocabData[tab],html="",n=0;
    groups.forEach(function(g){
      var items=g[1].filter(function(x){return !q||norm(x.join(" ")).indexOf(q)>=0});
      if(!items.length)return;n+=items.length;
      html+='<section class="vocab-group"><h3>'+g[0]+'</h3><div class="vocab-list">'+items.map(function(x){
        return '<div class="vocab-item"><div><div class="vocab-it">'+x[0]+'</div><div class="vocab-fr">'+x[1]+'</div>'+(x[2]?'<div class="vocab-note">'+x[2]+'</div>':'')+'</div><button class="speak-mini" data-speak="'+x[0].replace(/"/g,"&quot;")+'" aria-label="Écouter">🔊</button></div>'
      }).join("")+'</div></section>';
    });
    document.getElementById("vocabResults").innerHTML=html||'<div class="card no-results">Aucun résultat.</div>';
    document.getElementById("vocabCount").textContent=n+" entrée"+(n>1?"s":"");
    document.querySelectorAll("[data-speak]").forEach(function(b){b.onclick=function(){speak(b.getAttribute("data-speak"))}});
  }
